# Nexus PostgreSQL datastore configuration
# This file is bind-mounted read-only; passwords come from Docker secrets
name=nexus
type=jdbc
jdbcUrl=jdbc\:postgresql\://postgres\:5432/nexus
username=${file\:/run/secrets/pg_user}
password=${file\:/run/secrets/pg_password}
advanced=maximumPoolSize\=20;connectionTimeout\=30000;idleTimeout\=600000;maxLifetime\=1800000
