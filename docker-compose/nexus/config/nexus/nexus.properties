# Nexus OSS Production Properties
nexus.datastore.enabled=true
nexus.datastore.nexus.jdbcUrl=jdbc:postgresql://postgres:5432/nexus
nexus.datastore.nexus.username=${file:/run/secrets/pg_user}
nexus.datastore.nexus.password=${file:/run/secrets/pg_password}
nexus.datastore.nexus.maximumPoolSize=20
nexus.datastore.nexus.advanced=maxLifetime\=600000

# HTTP settings - listen only on localhost (nginx handles external)
application-port=8081
application-host=0.0.0.0
nexus-args=${jetty.etc}/jetty.xml,${jetty.etc}/jetty-http.xml,${jetty.etc}/jetty-requestlog.xml

# Security
nexus.security.anonymous.access=false

# Cluster / HA (single node)
nexus.clustered=false
