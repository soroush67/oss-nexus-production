services:
  nexus:
    image: docker-hosted.hamainsruance.net/sonatype/nexus3:3.80.0
    container_name: nexus_app
    restart: unless-stopped
    # Nexus official UID is 200
    user: "200:200"
    entrypoint: ["/entrypoint.sh"]
    environment:
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
    volumes:
      - nexus_data:/nexus-data
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./config/logback/logback.xml:/opt/sonatype/nexus/etc/logback/logback.xml:ro
    secrets:
      - pg_user
      - pg_password
    networks:
      - infra_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 3G
    security_opt:
      - no-new-privileges:true
    depends_on:
      - postgres_healthcheck_sentinel

  # Sidecar that waits for postgres before nexus starts
  postgres_healthcheck_sentinel:
    image: docker-hosted.hamainsruance.net/alpine:3.21
    container_name: nexus_pg_wait
    command: >
      sh -c "
        until nc -z postgres 5432; do
          echo 'waiting for postgres...'; sleep 2;
        done;
        echo 'postgres is up'
      "
    networks:
      - infra_net
    restart: "no"

secrets:
  pg_user:
    file: ../../secrets/pg_user.txt
  pg_password:
    file: ../../secrets/pg_password.txt

volumes:
  nexus_data:
    driver: local

networks:
  infra_net:
    external: true
    name: nexus_infra_net
